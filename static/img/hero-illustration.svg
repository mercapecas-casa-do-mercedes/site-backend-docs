<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c22525" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#852e2e" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background decorative elements -->
  <circle cx="250" cy="200" r="160" fill="url(#primaryGlow)" />
  <circle cx="380" cy="100" r="60" fill="#c22525" opacity="0.2" />
  <circle cx="100" cy="300" r="40" fill="#ffffff" opacity="0.1" />

  <!-- Code / Server Card Main Window -->
  <rect x="80" y="80" width="340" height="240" rx="16" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" filter="url(#shadow)" />
  
  <!-- Window Header -->
  <rect x="80" y="80" width="340" height="40" rx="16" fill="rgba(0, 0, 0, 0.2)" />
  <!-- Window buttons -->
  <circle cx="110" cy="100" r="6" fill="#ff5f56" />
  <circle cx="130" cy="100" r="6" fill="#ffbd2e" />
  <circle cx="150" cy="100" r="6" fill="#27c93f" />
  <text x="250" y="104" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">api.mercapecas.com.br</text>

  <!-- Code Snippet / API Visuals -->
  <!-- Line 1: Request -->
  <text x="110" y="150" fill="#61afef" font-family="monospace" font-size="14" font-weight="bold">POST</text>
  <text x="160" y="150" fill="#98c379" font-family="monospace" font-size="14">/api/v1/contato</text>
  <rect x="350" y="137" width="50" height="18" rx="4" fill="#27c93f" opacity="0.2"/>
  <text x="375" y="150" fill="#27c93f" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">200 OK</text>

  <!-- Line 2: JSON Response Body -->
  <text x="110" y="180" fill="#e5c07b" font-family="monospace" font-size="13">{</text>
  <text x="130" y="200" fill="#e06c75" font-family="monospace" font-size="13">&quot;success&quot;:</text>
  <text x="215" y="200" fill="#d19a66" font-family="monospace" font-size="13">true,</text>
  <text x="130" y="220" fill="#e06c75" font-family="monospace" font-size="13">&quot;message&quot;:</text>
  <text x="215" y="220" fill="#98c379" font-family="monospace" font-size="13">&quot;E-mail enviado!&quot;</text>
  <text x="110" y="240" fill="#e5c07b" font-family="monospace" font-size="13">}</text>

  <!-- Floating Badge: TypeScript -->
  <g transform="translate(60, 240)">
    <rect x="0" y="0" width="100" height="40" rx="10" fill="#3178c6" filter="url(#shadow)"/>
    <text x="50" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">TypeScript</text>
  </g>

  <!-- Floating Badge: Node.js -->
  <g transform="translate(340, 220)">
    <rect x="0" y="0" width="100" height="40" rx="10" fill="#339933" filter="url(#shadow)"/>
    <text x="50" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Node.js</text>
  </g>

  <!-- Floating Badge: Resend API -->
  <g transform="translate(280, 50)">
    <rect x="0" y="0" width="110" height="36" rx="8" fill="#ffffff" opacity="0.95" filter="url(#shadow)"/>
    <text x="55" y="23" fill="#111111" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">✉️ Resend API</text>
  </g>

  <!-- Connection line accents -->
  <path d="M 200 300 Q 250 340 300 300" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
</svg>
